name: Mintlify Broken Links

on:
  push:

permissions:
  contents: read

jobs:
  broken-links:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
        
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
      
      - name: Install Mintlify
        run: npm i -g mintlify@latest
        
      - name: Check Broken Links
        run: mintlify broken-links