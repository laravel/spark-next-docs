name: Plain index

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: read

jobs:
  lint:
    name: Lint

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '18'

      - name: Install CLI
        run: npm install -g @team-plain/cli@latest

      - name: Plain index
        run: plain index-sitemap https://spark.laravel.com/docs/sitemap.xml --labelTypeIds lt_01JAZTMHV9XNNYN8DR7424DMPB
        env:
          PLAIN_API_KEY: ${{ secrets.PLAIN_API_KEY }}
